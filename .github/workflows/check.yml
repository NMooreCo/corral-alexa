name: Check

# Builds every page, typechecks the Worker and the screens, and runs every test, as `pnpm check` does locally,
# then runs the tests again on a machine clock at UTC+14, so nothing leans on the server's own time zone.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The runner's clock is UTC and the sample household's Denver; Kiritimati's date is a day ahead of both most hours.
      # The first line fails the step if Node didn't take the zone, rather than quietly testing in UTC again.
      - name: Tests on Pacific/Kiritimati time
        env:
          TZ: Pacific/Kiritimati
        run: |
          node -e "process.exit(new Date().getTimezoneOffset() === -840 ? 0 : 1)"
          pnpm exec vitest run
